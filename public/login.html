<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in - VenueBook</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="nav" id="site-nav"></header>

<div class="form-card">
  <h2>Welcome back</h2>
  <p style="font-size:0.9rem;">Log in to book seats and manage your tickets.</p>

  <div id="form-alert"></div>

  <form id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" required>

    <button type="submit" class="btn btn-gold btn-block" style="margin-top:22px;">Log in</button>
  </form>

  <p class="form-note">New here? <a href="register.html">Create an account</a></p>
  <p class="form-note">Admin demo login: admin@events.com / admin123</p>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  renderNav('login');

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('form-alert');
    alertBox.innerHTML = '';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const data = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password })
      });
      saveSession(data.token, data.user);
      const params = new URLSearchParams(window.location.search);
      window.location.href = params.get('next') || 'index.html';
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    }
  });
</script>
</body>
</html>
